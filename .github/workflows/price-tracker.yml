name: Price Tracker

# NOT: Trendyol, GitHub Actions'ın (ve genel olarak çoğu bulut/datacenter IP'sinin)
# isteklerini "blocked malicious bot" diyerek 403 ile reddediyor (Cloudflare bot
# koruması). Bu yuzden zamanlanmis (schedule) tetikleyici kapali birakildi -
# script gercekte calisip veri cekemiyor. Kod referans/yedek olarak duruyor;
# calistirmak icin workflow_dispatch ile elle tetikleyebilirsin (Trendyol disinda,
# bot korumasi olmayan bir site icin isine yarayabilir).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check prices and stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update price/stock state"
            git pull --rebase
            git push
          fi
