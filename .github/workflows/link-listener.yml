name: Link Listener

# NOT: Trendyol, GitHub Actions'ın (ve genel olarak çoğu bulut/datacenter IP'sinin)
# isteklerini "blocked malicious bot" diyerek 403 ile reddediyor (Cloudflare bot
# koruması). Bu yuzden zamanlanmis (schedule) tetikleyici kapali birakildi -
# script Trendyol sayfasini gercekte cekemiyor. Kod referans/yedek olarak
# duruyor; calistirmak icin workflow_dispatch ile elle tetikleyebilirsin.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new product links
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_links.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked products"
            git pull --rebase
            git push
          fi
