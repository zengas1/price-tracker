name: Price Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug fetch
        run: |
          curl -s -o response.html -w "HTTP %{http_code}, %{size_download} bytes\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            "https://www.trendyol.com/english-home/tmk-5030-izgara-ve-tost-makinesi-inox-p-872054885?boutiqueId=61"
          head -c 1000 response.html
          echo ""
          echo "---JSON-LD count---"
          grep -o "application/ld+json" response.html | wc -l

      - name: Check prices and stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Show log
        if: always()
        run: cat tracker.log

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update price/stock state"
            git pull --rebase
            git push
          fi
