name: Faiz Oranlari - Guncelle

on:
  push:
    branches-ignore: [main]
    paths:
      - "faiz-hesaplama/tools/**"
      - ".github/workflows/faiz-oranlari.yml"
  workflow_dispatch:

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python faiz-hesaplama/tools/kaynak_incele.py
